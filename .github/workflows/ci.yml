name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # @electron/get honors this env var to pick where it caches the downloaded
  # Electron zip. Paired with the actions/cache step below, this avoids
  # re-downloading Electron (~100+ MB) on every run.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  checks:
    name: Typecheck, lint, test, build
    # Windows-only for now: this is currently a Windows-only Electron panel.
    # macOS/ubuntu legs join this matrix once cross-platform support lands
    # (see issue #5) — do not add them ad hoc before that.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm/action-setup does not support pnpm v11 (this repo pins pnpm 11
      # via `allowBuilds` conventions and the committed lockfile) — its own
      # docs say to use pnpm/setup instead for v11+. pnpm/setup also installs
      # the pinned Node.js runtime in the same step, so a separate
      # actions/setup-node step is not needed.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Read Electron version
        id: electron-version
        shell: bash
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies.electron)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  release:
    name: Package Windows installers
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Read Electron version
        id: electron-version
        shell: bash
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies.electron)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Windows installers
        run: pnpm package

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: DwarfAI-Miners-windows-x64
          path: |
            release/DwarfAI-Miners-Setup-*.exe
            release/DwarfAI-Miners-Portable-*.exe
