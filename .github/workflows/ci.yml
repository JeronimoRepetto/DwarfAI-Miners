name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # @electron/get honors this env var to pick where it caches the downloaded
  # Electron zip. Paired with the actions/cache step below, this avoids
  # re-downloading Electron (~100+ MB) on every run.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  checks:
    name: Privacy guard, typecheck, lint, format, skills-sync, test, build
    # Windows-only for now. Cross-platform support has landed (issue #5) and
    # the whole suite is platform-independent — every per-OS builder is tested
    # by passing the platform explicitly — so a macos-latest/ubuntu-latest
    # matrix would pass as-is. The `release` job below already covers all
    # three OSes (issue #16); expanding `checks` to match is a separate,
    # deliberate follow-up, not an ad-hoc addition.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Recurrence guard for the pre-publication privacy audit (issue #32,
      # docs/privacy-audit.md). Test paths, fixtures and shipped defaults used
      # to carry the maintainer's machine username, hostname and personal
      # second Claude root; those were replaced with the placeholders `j`,
      # `placeholder-host` and `~/.claude-work`. This step fails the build if
      # any of them is reintroduced.
      #
      # The patterns are anchored so the project's intentional public identity
      # never trips them: `jeronimorepetto` (GitHub handle, Ko-fi link, the
      # `com.jeronimorepetto.dwarfaiminers` bundle id) and the name in LICENSE
      # only match after a `Users`/`home` path separator, which none of them
      # have.
      #
      # What this step does NOT cover (issue #54). Each gap is a decision, not
      # a pending fix, and a green run proves only that four strings are absent
      # from the text of tracked files:
      #
      # 1. Private project names are not searched for, and that is settled
      #    rather than pending. The sibling directories on the maintainer's
      #    machine run from unmistakable to words that turn up in ordinary
      #    prose, and a list wide enough to catch the second kind fails the
      #    build on sentences that leak nothing. A narrow list of the
      #    unmistakable ones was worth it only alongside a history rewrite,
      #    because every name added here is a name this file publishes and
      #    this file is already a plaintext index. #51 has since chosen to
      #    publish as is, so there is no rewrite: adding the names would
      #    publish them a second time and buy nothing the standing instruction
      #    does not. Project names are unchecked on purpose: they come out by
      #    reading, never by CI. That is routine, not exceptional — one reached
      #    HEAD in docs/performance.md, and four more in src/** comments, fixed
      #    in 3a8b0e3.
      # 2. The patterns live in the PRIVACY_GUARD_PATTERN repository secret,
      #    not in this file. Until the repository went public this step spelled
      #    them out and excluded itself from the scan, so the one file that
      #    named every identifier was the one file never scanned — and the one
      #    file every visitor would read. Building the patterns from fragments
      #    or an encoded blob was considered for #54 and turned down because it
      #    obscures rather than removes; a secret removes. Two consequences,
      #    both deliberate: a MISSING secret fails the run rather than passing
      #    it, because a guard that cannot look must not report clean; and a
      #    pull request from a fork, which gets no secrets, is skipped with a
      #    notice, because the push to main after its merge runs the guard
      #    with the secret and goes red if anything got in. A failing run still
      #    prints the matching line into the build log, as it always did — the
      #    line is the finding. The history is issue #51's subject and stays
      #    published as it was: earlier revisions of this file carry the
      #    patterns, and that was accepted knowingly before going public.
      # 3. Images are invisible to it. `-I` skips binary files, so an
      #    identifier legible in a committed screenshot passes green. Issue #18
      #    was a screenshot leak and a human caught it, not CI. Screenshots
      #    need eyes before they need a build; skills/privacy-guard/SKILL.md
      #    lists what to read in one before it is staged.
      - name: Privacy guard (no machine-specific identifiers)
        shell: bash
        env:
          PATTERN: ${{ secrets.PRIVACY_GUARD_PATTERN }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$PATTERN" ]; then
            if [ "$FROM_FORK" = "true" ]; then
              echo "::notice::Privacy guard skipped: a fork's pull request gets no secrets. The push to main after merge runs it."
              exit 0
            fi
            echo "::error::PRIVACY_GUARD_PATTERN is not set; the privacy guard cannot run and must not pass silently."
            exit 1
          fi
          ! git grep -n -I -E "$PATTERN" -- .

      # pnpm/action-setup does not support pnpm v11 (this repo pins pnpm 11
      # via `allowBuilds` conventions and the committed lockfile) — its own
      # docs say to use pnpm/setup instead for v11+. pnpm/setup also installs
      # the pinned Node.js runtime in the same step, so a separate
      # actions/setup-node step is not needed.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Read Electron version
        id: electron-version
        shell: bash
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies.electron)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # AGENTS.md's catalogue and auto-invoke tables are generated from each
      # skill's own frontmatter, which is the whole reason the instructions and
      # the metadata cannot drift apart. That only holds if drift fails the
      # build: a hand-edited table or a skill added without regenerating would
      # otherwise sit there being quietly wrong. --check writes nothing.
      - name: Skills in sync with AGENTS.md
        run: node skills/skill-sync/assets/sync.mjs --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # electron-builder cannot cross-build a dmg or a deb, so macOS/Linux
  # artifacts each need their own runner — hence the matrix below. Each leg
  # packages its own installers and attaches them to the same GitHub Release
  # for the pushed tag.
  release:
    name: Package installers and publish release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_script: package
            asset_files: |
              release/DwarfAI-Miners-Setup-*.exe
              release/DwarfAI-Miners-Portable-*.exe
          # Mac artifact names come from the `build.mac.artifactName` template
          # in package.json (`${productName}-${version}-${arch}.${ext}`), so
          # the dmg/zip files carry no `-mac` suffix — e.g.
          # `DwarfAI-Miners-0.1.0-arm64.dmg` / `DwarfAI-Miners-0.1.0-x64.zip`.
          - os: macos-latest
            package_script: package:mac
            asset_files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            package_script: package:linux
            asset_files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - name: Read Electron version
        id: electron-version
        shell: bash
        run: |
          version=$(node -e "console.log(require('./package.json').devDependencies.electron)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package installers
        run: pnpm ${{ matrix.package_script }}

      # softprops/action-gh-release's release() already retries and
      # reconciles concurrent creates against the same tag (it picks the
      # canonical non-draft/oldest-id release), so no separate "create the
      # release first" job is needed for the three legs racing to create it.
      #
      # `generate_release_notes` is scoped to a single leg (ubuntu-latest) on
      # purpose: GitHub's API re-generates notes from commits on every
      # updateRelease call, and — because the other legs pass no body, the
      # action falls back to re-sending the existing body — flipping this on
      # for all three legs would prepend a fresh copy of the same notes on
      # every leg that runs after the first, duplicating them. `append_body`
      # stays on for all legs as a safety net: it only appends when a leg's
      # own body is non-empty, which is never the case here, so it never
      # clobbers whatever the notes-leg has already written.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
          append_body: true
          fail_on_unmatched_files: true
          files: ${{ matrix.asset_files }}
