# pnpm 11 gotcha (learned on a sibling project): `onlyBuiltDependencies`
# in package.json is IGNORED. Build scripts must be allowed here for a
# package that still has one. Electron 42+ ships no postinstall any more —
# it downloads its binary lazily, on first run of its own `bin` — but pnpm
# still asks about it here regardless, because `electron` is on pnpm's own
# default list of native-build risks, not detected from its scripts field.
# `false` (not omitted) says so explicitly and keeps pnpm from rewriting this
# file with an unresolved placeholder on the next install. `pnpm dev`/`pnpm
# preview` run `install-electron` ahead of electron-vite instead (see
# package.json and #466).
allowBuilds:
  electron: false
  electron-winstaller: true
  esbuild: true

# pnpm 11 gotcha: non-auth/registry settings are IGNORED in .npmrc (pnpm 11
# moved them here). @napi-rs/keyring (the SecretStore's keyring library,
# bundled, ADR-017) ships its native binding as one optional package per
# platform+arch; pnpm only installs the one matching the host running
# `pnpm install`. macOS builds both arm64 and x64 targets from one host (see
# build.mac.target in package.json), so a Mac needs BOTH darwin arches
# regardless of which one it is. os/cpu is a cross product, not a set of
# pairs, so widening it to cover darwin's two arches also pulls in the other
# platforms' bindings; a `libc` restriction was tried and does not reliably
# exclude the musl duplicates when cross-installing from a non-Linux host.
# AMENDED for ISSUE-184, the step-3a deletion (was: written for
# @anthropic-ai/claude-agent-sdk's per-platform runtimes, pruned at packaging
# by scripts/pruneSdkRuntimes.mjs): the Agent SDK left the tree, and the
# keyring's own per-platform bindings still need this block.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
